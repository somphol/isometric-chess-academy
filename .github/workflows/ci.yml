name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax
        run: node --check script.js
      - name: Engine, puzzles, i18n and state
        run: node scripts/check.mjs
